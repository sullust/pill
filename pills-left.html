/* Layout: one narrow column — prescription-label banner, take button, blister-pack supply, then the log. */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #16202B;
  --muted: #5D6B7A;
  --line: #D5DCE3;

@media (prefers-color-scheme: dark) {

    --bg: #0F141A;
    --surface: #18202A;
    --ink: #E8EEF4;
    --muted: #93A1B0;

:root[data-theme="dark"] {

* { box-sizing: border-box; }

  padding-inline: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.label {

  border: 2px solid var(--ink);
  border-radius: 6px;
  overflow: hidden;
}

.label-band {

  justify-content: space-between;
  gap: 1rem;
  background: var(--ink);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.45rem 0.9rem;
}

.label.low { border-color: var(--warn); }
.label.low .label-band { background: var(--warn); }

.label-body { padding: 0.9rem 0.9rem 1rem; }

.runout-date {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.6rem, 13vw, 3.6rem);
  line-height: 1;
  text-wrap: balance;
}

.left-line {
  margin: 0.55rem 0 0;
  font-size: 1.05rem;
}

.left-line strong { font-variant-numeric: tabular-nums; }
.label.low .left-line strong { color: var(--warn); }

.rx {
  display: flex;
  flex-wrap: wrap;

  margin-top: 0.85rem;
  padding-top: 0.7rem;
  border-top: 1px dashed var(--line);

  gap: 0.6rem;

  border: none;
  border-radius: 999px;

  color: var(--accent-ink);
  font-family: var(--font-body);
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.08s ease, opacity 0.15s ease;
}

.take-btn:active:not(:disabled) { transform: scale(0.97); }
.take-btn:disabled { opacity: 0.45; cursor: default; }
.take-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.status {
  margin: 0.55rem 0 0;
  min-height: 1.1rem;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
}

.status[data-tone="warn"] { color: var(--warn); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.85rem;
}

.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.3rem;
  letter-spacing: 0.02em;
}

.reset-btn {
  background: none;
  border: none;
  padding: 0.35rem 0.1rem;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;

.reset-btn.armed { color: var(--warn); }
.reset-btn:disabled { opacity: 0.45; cursor: default; }
.reset-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.blister {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0.55rem;
  padding: 0.8rem;
  background: var(--bg);
  border-radius: 10px;
}

.cap {
  aspect-ratio: 2 / 1;
  max-width: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent) 50%, color-mix(in srgb, var(--accent) 45%, var(--surface)) 50%);
}

.cap.taken {
  background: transparent;
  border: 1.5px dashed var(--line);
}

.caption {
  margin: 0.7rem 0 0;
  font-size: 0.85rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.day {
  margin: 0.9rem 0 0.25rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.day:first-child { margin-top: 0; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.55rem 0;
  border-top: 1px solid var(--line);
  font-size: 0.92rem;
}

.day + .row { border-top: none; }
.row .what { min-width: 0; }
.row.reset .what { color: var(--accent); font-weight: 600; }

.row time {
  flex: none;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.empty {
  margin: 0;
  font-size: 0.9rem;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .take-btn { transition: none; }
  .take-btn:active:not(:disabled) { transform: none; }
}

(function () {
  var START = 30;
  var LOW_AT = 5;
  var MAX_LOG = 2000;
  var LOCAL_KEY = "pillsLeft.local";
  // Must match the skeleton the Artifact tool wraps around the page, so a republish replaces it instead of nesting it.

  function readSeed() {

    catch (e) { return normalize(null); }

    if (mode === "readonly") return ["Read-only view — changes won’t save", "warn"];

        '<p class="left-line">' + leftLine + "</p>" +

      "<title>Pills Left</title>\n" +
      '<style id="app-style">' + styleEl.textContent + "</style>\n" +
